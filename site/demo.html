<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rasoi Waterfront — Site Under Maintenance</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0f1210;
      --gold: #c9a24b;
      --text: #f3efe6;
      --muted: #a9a196;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
      text-align: center;
      padding: 24px;
    }

    .card {
      max-width: 560px;
    }

    .brand {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2rem, 5vw, 3rem);
      color: var(--gold);
      letter-spacing: 0.03em;
      margin: 0 0 12px;
    }

    .divider {
      width: 64px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 24px;
      opacity: 0.6;
    }

    h1 {
      font-weight: 500;
      font-size: 1.4rem;
      margin: 0 0 16px;
      color: var(--text);
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--muted);
      margin: 0 0 8px;
    }

    .contact {
      margin-top: 28px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .contact a {
      color: var(--gold);
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">Rasoi Waterfront</p>
    <div class="divider"></div>
    <h1>We're currently undergoing scheduled maintenance</h1>
    <p>Our website is temporarily unavailable while we make some improvements.</p>
    <p>We'll be back online shortly — thank you for your patience.</p>
    <div class="contact">
      For reservations or enquiries, call us on <a href="tel:+441792462350">01792 462350</a>
    </div>
  </div>
</body>
</html>
